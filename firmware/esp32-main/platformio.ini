; FarmVision AgriRover — Main ESP32 DevKit V1 Firmware
; Milestone H5: Stage F0 Sensors-Only Firmware
; Target Board: DOIT ESP32 DEVKIT V1 (30-pin / 36-pin)

[platformio]
default_envs = esp32doit-devkit-v1
src_dir = src
include_dir = include

[env:esp32doit-devkit-v1]
platform = espressif32@^6.5.0
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D STAGE_F0_SENSORS_ONLY=1
    -D ACTUATORS_ENABLED=0
    -D ARDUINOJSON_ENABLE_STD_STRING=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
